name: Stale Issues
on:
  schedule:
    - cron: "0 0 * * *"
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will remain open — this label is informational only; this project never auto-closes."
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will remain open — this label is informational only; this project never auto-closes."
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: "stale"
          stale-pr-label: "stale"
